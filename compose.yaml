services:
  webdev_a_mysql:
    image: mysql:8.0
    container_name: webdev_a_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - webdev_a_db_data:/var/lib/mysql  # Corrected volume name
    networks:
      - webdev_a_network

  webdev_a_phpmyadmin:
    image: phpmyadmin
    container_name: webdev_a_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: webdev_a_mysql
    ports:
      - "8081:80"
    networks:
      - webdev_a_network

volumes:
  webdev_a_db_data:  # Corrected definition

networks:
  webdev_a_network: